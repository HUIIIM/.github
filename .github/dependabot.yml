version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/standards/a11y"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  # Hash-locked CI tools: Dependabot updates the pins and hashes in .github/ci/requirements.txt.
  - package-ecosystem: "pip"
    directory: "/.github/ci"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
