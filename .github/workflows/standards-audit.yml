# Independent daily assessment of the portfolio (STANDARDS.md §考核).
#
# Clones every repository in standards/repos.json, runs standards/audit.py with
# live probes, and commits the result as standards/SCORECARD.md +
# standards/scorecard.json. Red grades are published too.
#
# Secret STANDARDS_TOKEN (fine-grained, the registry repos only) needs
# contents:read to clone them and issues:write so standards/incidents.py can
# file, update and close incidents (labels are created when missing). Without
# it the card is still published, every unreadable repo is graded MISSING and
# the run fails. Auto-upgrade PRs via bootstrap.py are not automated yet.
name: standards-audit

on:
  schedule:
    - cron: "40 3 * * *"   # daily 03:40 UTC
  workflow_dispatch:
  pull_request:
    paths: ["standards/audit.py", "standards/repos.json", ".github/workflows/standards-audit.yml"]

permissions:
  contents: read

concurrency:
  group: standards-audit-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Pull requests run code the PR controls (audit.py, this file), so this job gets
  # no secrets, a read-only token and no persisted credentials. It only proves the
  # assessor runs and that unreadable repositories are graded MISSING, not dropped.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Incident filer unit tests (fake gh, no network)
        run: python3 -m unittest -v standards/test_incidents.py
      - name: Assessor runs; unreadable repositories are graded MISSING
        run: |
          mkdir -p /tmp/portfolio && ln -s "$GITHUB_WORKSPACE" /tmp/portfolio/.github
          set +e
          python3 standards/audit.py /tmp/portfolio --json /tmp/card.json --md > /tmp/card.md
          code=$?
          set -e
          cat /tmp/card.md >> "$GITHUB_STEP_SUMMARY"
          python3 - "$code" <<'PY'
          import json, sys
          code = int(sys.argv[1])
          reg = json.load(open("standards/repos.json"))["repos"]
          card = json.load(open("/tmp/card.json"))
          want = {n for n, m in reg.items() if m["status"] != "fork"}
          graded = {r["repo"] for r in card["repos"]}
          missing = {r["repo"] for r in card["repos"] if r.get("missing")}
          assert graded == want, f"card covers {sorted(graded)}, registry has {sorted(want)}"
          assert missing == want - {".github"}, f"MISSING rows wrong: {sorted(missing)}"
          assert all(r["score"] == 0 and r["grade"] == "C" and r["severity"] == "P0" for r in card["repos"] if r.get("missing"))
          assert card["summary"]["repos"] == len(want), card["summary"]
          assert "graded MISSING" in open("/tmp/card.md").read()
          assert code == 2, f"expected exit 2 with missing repos, got {code}"
          print(f"ok: {len(want)} registered, {len(missing)} MISSING rows, exit {code}")
          PY

  assess:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Clone every registered repository (read-only, default branch)
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/portfolio
          python3 - <<'PY' > /tmp/repos.txt
          import json
          reg = json.load(open("standards/repos.json"))["repos"]
          for name, m in reg.items():
              if m["status"] != "fork":
                  print(name)
          PY
          while read -r name; do
            if [ "$name" = ".github" ]; then ln -s "$GITHUB_WORKSPACE" /tmp/portfolio/.github; continue; fi
            src="$name"; [ "$name" = "miao-ai" ] && src="anomalies-autogpt"
            [ "$name" = "vertciti-prototype" ] && src="vertcity-prototype"
            if ! gh repo clone "HUIIIM/$src" "/tmp/portfolio/$name" -- --depth 1 -q 2>/tmp/err; then
              echo "::error::$name: clone failed ($(tail -1 /tmp/err)) — graded MISSING (0, C, P0)"
            fi
          done < /tmp/repos.txt
          ls /tmp/portfolio

      - name: Assess (live probes on)
        run: |
          set +e
          python3 standards/audit.py /tmp/portfolio --live --json standards/scorecard.json --md > standards/SCORECARD.md
          echo "audit exit code: $? (2 = repos MISSING, 1 = at least one MUST failing; the scorecard is still published)"
          python3 standards/audit.py /tmp/portfolio --live --incidents > /tmp/incidents.json
          cat standards/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"

      # MSG-1 (STANDARDS.md): the company sending domain passes the AUTH checks of
      # MESSAGING.md, for EVERY DKIM selector it signs with. A domain, not a repository:
      # it gets its own section on the card and a `messaging` entry in scorecard.json
      # (which the website and profile read), not a per-repo score or incident. A failing
      # or unevaluated MUST is shown as such; it does not fail this run.
      - name: Messaging domain check (MSG-1, published on the card and in scorecard.json)
        env:
          MSG_DOMAIN: vertciti.com
          MSG_SELECTORS: resend zmail
        run: |
          {
            echo ""
            echo "## MSG-1 · 发信域 \`$MSG_DOMAIN\`"
          } >> standards/SCORECARD.md
          worst=0
          results=""
          for sel in $MSG_SELECTORS; do
            set +e
            python3 standards/check_messaging_dns.py "$MSG_DOMAIN" --selector "$sel" --md > "/tmp/msg-$sel.md" 2>"/tmp/msg-$sel.err"
            code=$?
            set -e
            case $code in
              0) line="**selector \`$sel\`: PASS** — every AUTH MUST shown to pass." ;;
              1) line="**selector \`$sel\`: FAIL** — at least one AUTH MUST failed or could not be shown to pass (UNMET)." ;;
              *) line="**selector \`$sel\`: unprobed** — the checker could not run (exit $code): $(tail -1 "/tmp/msg-$sel.err"). Unprobed is not passed (STANDARDS.md §考核 2)." ;;
            esac
            { echo ""; echo "$line"; echo ""; sed '1,2d' "/tmp/msg-$sel.md"; } >> standards/SCORECARD.md
            cat "/tmp/msg-$sel.md" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" -gt "$worst" ] && worst=$code
            results="$results $sel=$code"
          done
          python3 - "$MSG_DOMAIN" "$worst" $results <<'PY'
          import json, sys
          domain, worst, pairs = sys.argv[1], int(sys.argv[2]), sys.argv[3:]
          status = {0: "pass", 1: "fail"}.get(worst, "unprobed")
          card = json.load(open("standards/scorecard.json"))
          card["messaging"] = {"check": "MSG-1", "level": "MUST", "domain": domain, "status": status,
                               "selectors": {p.split("=")[0]: {0: "pass", 1: "fail"}.get(int(p.split("=")[1]), "unprobed")
                                             for p in pairs}}
          open("standards/scorecard.json", "w", encoding="utf-8").write(json.dumps(card, ensure_ascii=False, indent=1) + "\n")
          print(f"MSG-1 {domain}: {status} {card['messaging']['selectors']}")
          PY
          [ "$worst" = 0 ] || echo "::warning::MSG-1 for $MSG_DOMAIN is not passing; see SCORECARD.md / scorecard.json messaging"

      # This repo's main is PR-gated (fleet standard, P2-8), so the card reaches
      # it through a standing pull request, never a direct push. One branch,
      # force-updated daily; the PR is merged through the normal review flow.
      - name: Propose scorecard to this repo (standing PR)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: standards/daily-card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standards/SCORECARD.md standards/scorecard.json
          if git diff --cached --quiet; then
            echo "scorecard unchanged"
            exit 0
          fi
          git switch -q -c "$BRANCH"
          git commit -q -m "standards: daily scorecard $(date -u +%F)" \
            -m "Machine-generated by the standards-audit assess job (single source of the card)."
          git push -q --force origin "$BRANCH"
          open=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            echo "updated standing PR #$open"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "standards: daily scorecard" \
              --body "Daily scorecard from the standards-audit assess job (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). This branch is force-updated every day; merge to publish the latest card to main."
          fi

      # The website deploys production from its main branch, so the card reaches it
      # through a pull request there (that repo's checks + its merge), never a direct
      # push, and under the bot's own identity. One branch, one open PR, updated daily.
      - name: Propose scorecard to website repo (needs SCORECARD_SYNC_TOKEN)
        env:
          SYNC_TOKEN: ${{ secrets.SCORECARD_SYNC_TOKEN }}
          BRANCH: standards/daily-scorecard
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::SCORECARD_SYNC_TOKEN not set: website scorecard not proposed."
            exit 0
          fi
          rm -rf /tmp/website-sync
          git clone -q --depth 1 "https://x-access-token:${SYNC_TOKEN}@github.com/HUIIIM/vertciti-website.git" /tmp/website-sync
          cp standards/scorecard.json /tmp/website-sync/standards/scorecard.json
          cd /tmp/website-sync
          base=$(git rev-parse --abbrev-ref HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standards/scorecard.json
          if git diff --cached --quiet; then
            echo "website scorecard already current on $base"
            exit 0
          fi
          git switch -q -c "$BRANCH"
          git commit -q -m "standards: daily scorecard $(date -u +%F)" \
            -m "Machine-generated from HUIIIM/.github standards-audit (single source of the card)."
          git push -q --force origin "$BRANCH"
          export GH_TOKEN="$SYNC_TOKEN"
          open=$(gh pr list -R HUIIIM/vertciti-website --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            echo "updated website PR #$open"
          else
            gh pr create -R HUIIIM/vertciti-website --base "$base" --head "$BRANCH" \
              --title "standards: daily scorecard" \
              --body "Daily scorecard from HUIIIM/.github standards-audit (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). This branch is force-updated every day; merge whenever the site should show the latest card."
          fi

      - name: Sync grading line to profile repo (needs SCORECARD_SYNC_TOKEN)
        env:
          SYNC_TOKEN: ${{ secrets.SCORECARD_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SCORECARD_SYNC_TOKEN not set: profile grading-line sync skipped."
            exit 0
          fi
          rm -rf /tmp/profile-sync
          git clone -q --depth 1 "https://x-access-token:${SYNC_TOKEN}@github.com/HUIIIM/HUIIIM.git" /tmp/profile-sync
          python3 - <<'PYEOF'
          import json, re
          d = json.load(open('standards/scorecard.json'))
          date = d['generated'].split(' ')[0]
          repos = d['summary']['repos']; at_bar = d['summary']['at_bar']
          line = (f"**Graded daily.** {repos} repos graded by the company's own assessor \u00b7 {date} \u00b7 "
                  f"{at_bar}/{repos} at the bar (A++) \u2014 red grades published too: "
                  f"[the daily scorecard](https://github.com/HUIIIM/.github/blob/main/standards/SCORECARD.md).")
          p = '/tmp/profile-sync/README.md'
          s = open(p).read()
          s2 = re.sub(r'<!-- grading:start -->.*?<!-- grading:end -->',
                      '<!-- grading:start -->' + line + '<!-- grading:end -->', s, flags=re.S)
          if s2 != s:
              open(p, 'w').write(s2)
              print('grading line updated')
          else:
              print('grading line unchanged')
          PYEOF
          cd /tmp/profile-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "profile grading line already current" || \
            (git commit -m "chore: daily grading line sync" && git push)

      - name: File, update or close incidents (needs STANDARDS_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STANDARDS_TOKEN not set: no incident was filed, updated or closed (they are published in SCORECARD.md only)."
            cat /tmp/incidents.json
            exit 0
          fi
          python3 standards/incidents.py standards/scorecard.json

      # Last, after the honest card is published everywhere: an incomplete card
      # must not pass silently. Any MISSING repository fails the run.
      - name: Fail when registered repositories could not be read
        if: ${{ !cancelled() }}  # still runs when incident filing failed above
        run: |
          python3 - <<'PY'
          import json, sys
          missing = json.load(open("standards/scorecard.json"))["missing_repos"]
          if missing:
              print(f"::error::{len(missing)} registered repo(s) graded MISSING (clone failed): {', '.join(missing)}. "
                    "Set STANDARDS_TOKEN (fine-grained, contents:read on the registry repos).")
              sys.exit(1)
          print("all registered repositories were read")
          PY
