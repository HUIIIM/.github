# Independent daily assessment of the portfolio (STANDARDS.md §考核).
#
# Clones every repository in standards/repos.json, runs standards/audit.py with
# live probes, and commits the result as standards/SCORECARD.md +
# standards/scorecard.json. Red grades are published too.
#
# Cross-repository incident filing (issues in the graded repos) needs a token
# with issues:write on those repos: secret STANDARDS_TOKEN. Without it this job
# still publishes the scorecard and prints the incident list; filing and the
# auto-upgrade PRs are then done by the daily Miao/Claude "standards" routine.
name: standards-audit

on:
  schedule:
    - cron: "40 3 * * *"   # daily 03:40 UTC
  workflow_dispatch:
  pull_request:
    paths: ["standards/audit.py", "standards/repos.json", ".github/workflows/standards-audit.yml"]

permissions:
  contents: write

concurrency:
  group: standards-audit
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone every registered repository (read-only, default branch)
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/portfolio
          python3 - <<'PY' > /tmp/repos.txt
          import json
          reg = json.load(open("standards/repos.json"))["repos"]
          for name, m in reg.items():
              if m["status"] != "fork":
                  print(name)
          PY
          while read -r name; do
            if [ "$name" = ".github" ]; then ln -s "$GITHUB_WORKSPACE" /tmp/portfolio/.github; continue; fi
            src="$name"; [ "$name" = "miao-ai" ] && src="anomalies-autogpt"
            [ "$name" = "vertciti-prototype" ] && src="vertcity-prototype"
            if ! gh repo clone "HUIIIM/$src" "/tmp/portfolio/$name" -- --depth 1 -q 2>/tmp/err; then
              echo "::warning::$name: clone failed ($(tail -1 /tmp/err)) — graded as missing"
            fi
          done < /tmp/repos.txt
          ls /tmp/portfolio

      - name: Assess (live probes on)
        run: |
          set +e
          python3 standards/audit.py /tmp/portfolio --live --json standards/scorecard.json --md > standards/SCORECARD.md
          echo "audit exit code: $? (1 = at least one MUST failing; the scorecard is still published)"
          python3 standards/audit.py /tmp/portfolio --live --incidents > /tmp/incidents.json
          cat standards/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish scorecard
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standards/SCORECARD.md standards/scorecard.json
          git diff --cached --quiet && echo "no change" || \
            (git commit -m "standards: daily scorecard $(date -u +%F) [skip ci]" && git push)

      - name: Sync scorecard to website repo (needs SCORECARD_SYNC_TOKEN)
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SYNC_TOKEN: ${{ secrets.SCORECARD_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SCORECARD_SYNC_TOKEN not set: website scorecard sync skipped."
            exit 0
          fi
          rm -rf /tmp/website-sync
          git clone -q --depth 1 "https://x-access-token:${SYNC_TOKEN}@github.com/HUIIIM/vertciti-website.git" /tmp/website-sync
          cp standards/scorecard.json /tmp/website-sync/standards/scorecard.json
          cd /tmp/website-sync
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add standards/scorecard.json
          git diff --cached --quiet && echo "website scorecard already current" || \
            (git commit -m "standards: daily scorecard sync $(date -u +%F)" -m "Machine-generated data sync from HUIIIM/.github standards-audit (single source). Authored under the fleet Claude identity so the Vercel author gate passes on the website production deploy." && git push)

      - name: Sync grading line to profile repo (needs SCORECARD_SYNC_TOKEN)
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SYNC_TOKEN: ${{ secrets.SCORECARD_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "SCORECARD_SYNC_TOKEN not set: profile grading-line sync skipped."
            exit 0
          fi
          rm -rf /tmp/profile-sync
          git clone -q --depth 1 "https://x-access-token:${SYNC_TOKEN}@github.com/HUIIIM/HUIIIM.git" /tmp/profile-sync
          python3 - <<'PYEOF'
          import json, re
          d = json.load(open('standards/scorecard.json'))
          date = d['generated'].split(' ')[0]
          repos = d['summary']['repos']; at_bar = d['summary']['at_bar']
          line = (f"**Graded daily.** {repos} repos graded by the company's own assessor \u00b7 {date} \u00b7 "
                  f"{at_bar}/{repos} at the bar (A++) \u2014 red grades published too: "
                  f"[the daily scorecard](https://github.com/HUIIIM/.github/blob/main/standards/SCORECARD.md).")
          p = '/tmp/profile-sync/README.md'
          s = open(p).read()
          s2 = re.sub(r'<!-- grading:start -->.*?<!-- grading:end -->',
                      '<!-- grading:start -->' + line + '<!-- grading:end -->', s, flags=re.S)
          if s2 != s:
              open(p, 'w').write(s2)
              print('grading line updated')
          else:
              print('grading line unchanged')
          PYEOF
          cd /tmp/profile-sync
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add README.md
          git diff --cached --quiet && echo "profile grading line already current" || \
            (git commit -m "chore: daily grading line sync" && git push)

      - name: File or update incidents (needs STANDARDS_TOKEN)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "STANDARDS_TOKEN not set: incidents are published in SCORECARD.md only; the daily standards routine files them."
            cat /tmp/incidents.json
            exit 0
          fi
          python3 - <<'PY'
          import json, subprocess, os
          reg = json.load(open("standards/repos.json"))["repos"]
          alias = {"miao-ai": "anomalies-autogpt", "vertciti-prototype": "vertcity-prototype"}
          for inc in json.load(open("/tmp/incidents.json")):
              repo = alias.get(inc["repo"], inc["repo"])
              if reg.get(inc["repo"], {}).get("status") != "active":
                  continue
              title = f"[standards] {inc['severity']}: score {inc['score']} ({inc['grade']}) below the A++ bar"
              body = ("Independent assessment (HUIIIM/.github standards/audit.py). Failing checks: "
                      + ", ".join(inc["failing"]) + (". Unprobed: " + ", ".join(inc["unprobed"]) if inc["unprobed"] else "")
                      + ".\n\nFull card: https://github.com/HUIIIM/.github/blob/main/standards/SCORECARD.md\n"
                      "Closes automatically when the next assessment finds the repo at or above the bar.")
              existing = subprocess.run(["gh", "issue", "list", "-R", f"HUIIIM/{repo}", "-l", "standards-incident", "--state", "open",
                                         "--json", "number", "-q", ".[0].number"], capture_output=True, text=True).stdout.strip()
              if existing:
                  subprocess.run(["gh", "issue", "edit", "-R", f"HUIIIM/{repo}", existing, "-t", title, "-b", body], check=False)
              else:
                  subprocess.run(["gh", "issue", "create", "-R", f"HUIIIM/{repo}", "-t", title, "-b", body,
                                  "-l", f"standards-incident,{inc['severity']}"], check=False)
          PY

      - name: Fail the job when registered repositories are missing
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("standards/scorecard.json"))
          missing = d.get("missing_repos", [])
          if missing:
              print(f"::error::{len(missing)} registered repositories were not assessed (MISSING, scored 0/P0): {', '.join(missing)}")
              sys.exit(1)
          print("all registered repositories assessed")
          PY
