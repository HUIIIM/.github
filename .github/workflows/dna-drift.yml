# Reusable: fail a consumer repo's CI when its vendored DNA stylesheet differs
# from the canonical build in HUIIIM/.github.
#
#   jobs:
#     dna:
#       uses: HUIIIM/.github/.github/workflows/dna-drift.yml@main
#       with:
#         vendored: frontend/src/app/dna-tailwind.css
#         flavor: dna-tailwind.css   # or dna.css
name: dna-drift

on:
  workflow_call:
    inputs:
      vendored:
        description: Path of the vendored copy in the calling repo
        required: true
        type: string
      flavor:
        description: dna.css or dna-tailwind.css
        required: true
        type: string

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: HUIIIM/.github
          path: .dna-upstream
      - name: Compare with upstream
        env:
          VENDORED: ${{ inputs.vendored }}
          FLAVOR: ${{ inputs.flavor }}
        run: |
          upstream=".dna-upstream/design/dist/$FLAVOR"
          if diff -q "$upstream" "$VENDORED" >/dev/null; then
            echo "DNA in sync: $(head -1 "$upstream")"
            exit 0
          fi
          echo "::error file=$VENDORED::Vendored DNA differs from HUIIIM/.github design/dist/$FLAVOR ($(head -1 "$upstream")). Re-copy it; never edit the vendored file."
          diff "$upstream" "$VENDORED" | head -40
          exit 1
