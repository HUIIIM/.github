name: Quality gate

# Blocking lint + typecheck for this repo's Python (standards/, design/).
# Tools install from a hash-locked file (.github/ci/requirements.txt, SOTA SEC-A5): a changed or
# substituted package fails the install. The lint rule set lives in ruff.toml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04  # pinned like every other workflow here (#14)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Ruff (hash-locked)
        run: |
          pip install --require-hashes -r .github/ci/requirements.txt
          ruff check .

  typecheck:
    runs-on: ubuntu-24.04  # pinned like every other workflow here (#14)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Mypy (hash-locked)
        run: |
          pip install --require-hashes -r .github/ci/requirements.txt
          mypy standards/ design/build.py
