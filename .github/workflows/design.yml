name: design

on:
  pull_request:
    paths: ["design/**", "standards/a11y/**", ".github/workflows/design.yml"]
  push:
    branches: [main]
    paths: ["design/**", "standards/a11y/**", ".github/workflows/design.yml"]

permissions:
  contents: read

jobs:
  tokens:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: dist/ matches tokens.json, every contrast pair passes WCAG AA, sizes on the QA-gate scales
        run: python3 design/build.py --check
      - name: Unit tests for the build checks
        run: python3 -m unittest -v design/test_build.py

  contrast:
    # Renders every DNA component and every token-on-surface pair in a real browser, light + dark,
    # phone + desktop, and fails if any visible text - incl. disabled controls, placeholders and text on
    # inverse surfaces - is below WCAG AA at the colour actually painted, or if the layout breaks.
    # ubuntu-24.04, not -latest: Playwright 1.56 cannot install Chromium on ubuntu 26.04 runners
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install Playwright (locked, hash-checked) + Chromium
        working-directory: standards/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      # components.html = every component and state; surfaces.html (generated by build.py) = every text
      # token on every surface (page, soft, card, ink, accent). Layout gate: no sideways scroll, no text
      # squeezed to one character per line, tap targets >= 44px (AESTHETICS §7, WCAG 2.5.8). Non-text gate:
      # component boundaries and keyboard focus rings >= 3:1 against what is painted around them (WCAG 1.4.11).
      - name: Contrast + layout + non-text gates (2 pages x light/dark x 390/1280)
        env:
          NODE_PATH: ${{ github.workspace }}/standards/a11y/node_modules
        run: |
          status=0
          for page in components surfaces; do for scheme in light dark; do for width in 390 1280; do
            url="file://$GITHUB_WORKSPACE/design/preview/$page.html"
            node standards/a11y/contrast_audit.js "$url" --scheme $scheme --width $width || status=1
            node standards/a11y/layout_audit.js "$url" --scheme $scheme --width $width || status=1
            node standards/a11y/nontext_audit.js "$url" --scheme $scheme --width $width || status=1
          done; done; done
          exit $status
      # The non-text gate must still catch what it exists for (WCAG 1.4.11): a known-bad page with exactly
      # 4 defects (faint input border, pale borderless button, no focus ring, orange ring on yellow).
      - name: Non-text gate catches its known-bad fixture
        env:
          NODE_PATH: ${{ github.workspace }}/standards/a11y/node_modules
        run: |
          set +e
          out=$(node standards/a11y/nontext_audit.js "file://$GITHUB_WORKSPACE/standards/a11y/fixtures/nontext-bad.html")
          code=$?
          set -e
          echo "$out"
          [ "$code" = 1 ] && echo "$out" | grep -q "non-text FAIL 4 " || { echo "::error::nontext_audit.js no longer reports the 4 fixture defects"; exit 1; }
