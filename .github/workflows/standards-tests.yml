# Regression tests for the assessor (standards/audit.py, standards/bootstrap.py).
# Runs PR code, so: read-only token, no secrets, no persisted credentials.
name: standards-tests

on:
  pull_request:
    paths: ["standards/*.py", ".github/workflows/standards-tests.yml"]
  push:
    branches: [main]
    paths: ["standards/*.py", ".github/workflows/standards-tests.yml"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: audit.py / bootstrap.py regression tests
        run: python3 -m unittest -v standards/test_audit.py
