# 闭环末态巡检（GitHub 面）: runs standards/loop_watch.py against the fleet and, when asked,
# keeps the ONE roll-call issue (label `loop-watch`) in this repository current.
#
# Dispatch-only on purpose: the 2026-11 audit (#150) was run under "不新建任何定时任务",
# so this workflow adds no schedule. To make the patrol periodic, the hub either adds a
# `schedule:` trigger here or has an existing scheduler task call
# `gh workflow run loop-watch.yml -f file=true` (docs/audits/2026-11-internal-automation-audit.md §6).
#
# Token: STANDARDS_TOKEN (the fleet read token the standards audit already uses) so private
# registry repos are visible. Without it the run still works on what the default token can
# see and exits 2 naming every registered repo it could not read: a coverage gap is loud.
# Exit codes: 0 clean, 1 overdue loops, 2 coverage gap, 3 UNKNOWN (a query did not complete).
name: loop-watch

on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Also read every open PR (verdicts on the current head, stale dispatch issues)"
        type: boolean
        default: true
      file:
        description: "Create/update/close the roll-call issue in this repository"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: loop-watch
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write  # the roll-call issue, only when `file` is set
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Patrol the end state of every dispatched loop
        env:
          GH_TOKEN: ${{ secrets.STANDARDS_TOKEN || github.token }}
          DEEP: ${{ inputs.deep }}
          FILE: ${{ inputs.file }}
        run: |
          args=()
          [ "$DEEP" = "true" ] && args+=(--deep)
          [ "$FILE" = "true" ] && args+=(--file)
          set +e
          python3 standards/loop_watch.py "${args[@]}" --json /tmp/loop-watch.json > /tmp/loop-watch.md
          code=$?
          set -e
          cat /tmp/loop-watch.md >> "$GITHUB_STEP_SUMMARY"
          echo "loop_watch exit code: $code (0 clean, 1 overdue, 2 coverage gap, 3 UNKNOWN)"
          exit "$code"
