<!doctype html>
<!-- Known-bad page for nontext_audit.js (WCAG 1.4.11). CI requires the gate to FAIL here with exactly
     the 4 defects marked BAD; the GOOD controls must not be reported. -->
<html lang="en"><meta charset="utf-8"><title>nontext fixture</title>
<style>
  body { background: #fff; color: #000; font: 16px sans-serif; padding: 24px; }
  input { display: block; margin: 8px 0; padding: 8px; font: inherit; }
  .faint { border: 1px solid #DDDDDD; }               /* BAD 1: boundary 1.36:1 */
  .ok-border { border: 1px solid #6B6B6B; }           /* GOOD: 5.33:1 */
  .pale-btn { background: #F3F3F3; border: 0; padding: 8px 16px; } /* BAD 2: fill 1.11:1, no border */
  .ink-btn { background: #000; color: #fff; border: 0; padding: 8px 16px; }   /* GOOD: fill 21:1 */
  :focus-visible { outline: 3px solid #000; outline-offset: 2px; }
  .no-ring:focus-visible { outline: none; }           /* BAD 3: no focus indicator */
  .yellow { background: #FFCE00; padding: 16px; }
  .yellow a:focus-visible { outline-color: #FF4713; } /* BAD 4: 2.28:1 on yellow */
  .text-btn { background: none; border: 0; text-decoration: underline; font: inherit; } /* GOOD: text only */
</style>
<input class="faint" aria-label="faint">
<input class="ok-border" aria-label="ok">
<button class="pale-btn" type="button">pale</button>
<button class="ink-btn" type="button">ink</button>
<button class="ink-btn no-ring" type="button">no ring</button>
<div class="yellow"><a href="#x">orange ring on yellow</a></div>
<button class="text-btn" type="button">text only</button>
</html>
